name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libmpfr6
      - uses: arturo-lang/setup-arturo@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from: stable
      - name: Add Arturo package binaries to PATH
        run: |
          echo "$HOME/.arturo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.arturo/packages/bin" >> "$GITHUB_PATH"
      - run: arturo -p install unitt 3.1.1
      - run: arturo --no-color test.art
      - run: arturo --no-color examples/basics/scoped.art
